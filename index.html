<!doctype html>
<html lang="de" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gym-Tracker</title>
  <meta name="description" content="Schlanker Gym-Tracker ohne Werbung – Daten bleiben auf dem Gerät.">
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gym">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./css/app.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <main id="main"><p class="muted center loading">Lädt …</p></main>

  <div id="timer" class="timer" hidden>
    <div class="timer-fill" id="timer-fill"></div>
    <button data-action="timer-add" data-d="-15" aria-label="15 Sekunden weniger">−15</button>
    <div class="timer-mid"><span class="small">Pause</span><b id="timer-clock">0:00</b></div>
    <button data-action="timer-add" data-d="15" aria-label="15 Sekunden mehr">+15</button>
    <button data-action="timer-stop" aria-label="Pause beenden">✕</button>
  </div>

  <div id="toast" class="toast" hidden role="status"></div>
  <button id="update" class="update" hidden>Update verfügbar – tippen zum Neuladen</button>

  <nav id="nav" class="nav"></nav>

  <dialog id="modal"><div id="modal-body"></div></dialog>

  <noscript>Diese App benötigt JavaScript.</noscript>
</body>
</html>
